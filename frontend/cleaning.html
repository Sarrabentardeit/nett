<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nettoyer Emails</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f3f8;
    color: #333;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    background: #1e40af;
    color: #fff;
    padding: 1.5rem 3rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  header img { height: 45px; }
  header h1 { margin: 0; font-size: 1.8rem; font-weight: 700; }

  main {
    flex: 1;
    max-width: 600px;
    margin: 3rem auto;
    padding: 0 1rem;
    text-align: center;
  }
  input[type="file"] {
    padding: 0.4rem;
  }
  button {
    margin-top: 1rem;
    background: #10b981;
    border: none;
    color: white;
    font-size: 1.1rem;
    padding: 0.7rem 2rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  button:hover {
    background: #047857;
  }

  #progressBar {
    width: 100%;
    height: 20px;
    margin-top: 1.5rem;
    display: none;
  }

  #statusText {
    margin-top: 1rem;
    font-weight: bold;
    color: #1e40af;
  }

  .spinner {
    display: none;
    margin: 1rem auto;
    border: 5px solid #f3f3f3;
    border-top: 5px solid #1e40af;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  footer {
    background: #1e40af;
    color: #f0f3f8;
    padding: 2.5rem 1rem;
  }
  .footer-container {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 2rem;
  }
  .contact-info {
    flex: 1 1 300px;
  }
  .contact-info h3 {
    margin-top: 0;
    font-size: 1.25rem;
    font-weight: 700;
  }
  .contact-info p, .contact-info a {
    color: #fbbf24;
    text-decoration: none;
    margin: 0.3rem 0;
    line-height: 1.5;
  }
  .contact-info a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<header>
  <img src="https://scraperapi.com/wp-content/themes/scraperapi/assets/images/logo.svg" alt="Logo" />
  <h1>Nettoyer Emails</h1>
</header>

<main>
  <form id="cleanForm" enctype="multipart/form-data">
    <input type="file" name="file" accept=".xlsx" required />
    <br />
    <button type="submit">Nettoyer</button>
  </form>

  <div id="statusText"></div>
  <div class="spinner" id="spinner"></div>
  <progress id="progressBar" value="0" max="100"></progress>
</main>

<footer>
  <div class="footer-container">
    <section class="contact-info">
      <h3>Contactez-nous</h3>
      <p>📍 123 Rue de la République, 75001 Paris, France</p>
      <p>📞 +33 1 23 45 67 89</p>
      <p>✉️ <a href="mailto:contact@monapplication.com">contact@monapplication.com</a></p>
    </section>
  </div>
</footer>

<script>
  document.getElementById('cleanForm').addEventListener('submit', async function(e){
    e.preventDefault();

    const progress = document.getElementById('progressBar');
    const spinner = document.getElementById('spinner');
    const statusText = document.getElementById('statusText');

    progress.style.display = 'block';
    progress.value = 10;
    spinner.style.display = 'block';
    statusText.textContent = "Traitement en cours, merci de patienter...";

    const formData = new FormData(this);
    try {
      const res = await fetch('http://localhost:5000/clean_emails', {
        method: 'POST',
        body: formData
      });

      if (!res.ok) throw new Error(await res.text());

      progress.value = 70;
      statusText.textContent = "Fichier prêt, téléchargement...";

      const blob = await res.blob();
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.download = "emails_valides.xlsx";
      link.click();

      progress.value = 100;
      spinner.style.display = 'none';
      statusText.textContent = "Téléchargement terminé ✅";
    } catch(err) {
      spinner.style.display = 'none';
      progress.style.display = 'none';
      statusText.textContent = "❌ Erreur : " + err.message;
    }
  });
</script>

</body>
</html>
